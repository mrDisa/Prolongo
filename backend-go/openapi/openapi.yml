openapi: 3.1.0
info:
  title: Prolongo API
  version: 1.0.0
  description: |
    Анализатор рисков оттока: рейтинг клиентов, причины риска, денежная оценка, настройки модели и источник данных.

    Общие договорённости (`docs/ОБЩЕЕ_ТЗ.md` §7.2):
    - JSON, поля в camelCase.
    - Деньги — целые евроценты в полях с суффиксом `Cents` (100 = €1). Фронт форматирует сам: `€1 234,56`.
    - Даты — ISO 8601 UTC с `Z`, например `2026-10-19T14:35:53.000Z`.
    - Все эндпоинты, кроме `auth/login`, `auth/config` и `auth/oidc/*`, требуют сессию (cookie `prolongo_session`). Без неё — 401.
    - Ошибки всегда в одном формате: `{"error": {"code", "message", "details"}}`. Неизвестный маршрут — 404 `not_found`, неверный метод — 405 `method_not_allowed`, сбой сервера — 500 `internal`.
    - Горизонт на лету: эндпоинты клиентов и аналитики принимают `horizonDays` (1–365) и считают с ним, не меняя настроек.

    Примеры в этом файле посчитаны по данным организаторов (`data/test-data/data.json`, часы `data` → 2026-10-19T14:35:53Z, веса по умолчанию). Prism-мок отдаёт именно их.

    Источник правды для контракта — этот файл и `docs/ОБЩЕЕ_ТЗ.md` §7. Владелец — Go-разработчик. Изменения — отдельным PR с сообщением команде.
servers:
  - url: /
    description: Тот же хост, через nginx (локально — http://localhost:8080)
security:
  - cookieAuth: []
tags:
  - name: auth
    description: Вход и сессия
  - name: customers
    description: Рейтинг и карточка клиента
  - name: analytics
    description: Сводка, деньги, график оттока
  - name: model
    description: Настройки модели риска
  - name: live
    description: Живые обновления
  - name: source
    description: Источник данных (сервис ingest на Django)
  - name: ops
    description: Метрики, документация и служебные эндпоинты

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход. Ставит cookie `prolongo_session` (HttpOnly, SameSite=Lax, Path=/, срок — SESSION_TTL_HOURS).
          headers:
            Set-Cookie:
              description: Cookie сессии
              schema: { type: string, example: 'prolongo_session=Zm9vYmFy; Path=/; Max-Age=43200; HttpOnly; SameSite=Lax' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_credentials, message: Неверный логин или пароль } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: Способы входа
      description: Публичный, без сессии. Экран входа узнаёт отсюда, показывать ли кнопку «Войти через SSO».
      security: []
      responses:
        '200':
          description: Доступные способы входа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь
      responses:
        '200':
          description: Сессия активна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершение сессии
      responses:
        '204':
          description: 'Сессия удалена, cookie очищена (Max-Age=-1)'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      operationId: oidcLogin
      summary: Вход через OIDC (бонус)
      description: Редирект на провайдера (Keycloak). Перед этим ставит короткоживущую cookie со state и PKCE.
      security: []
      responses:
        '302':
          description: Редирект на страницу входа провайдера
          headers:
            Location:
              description: Адрес authorize провайдера
              schema: { type: string, example: 'http://localhost:8081/realms/prolongo/protocol/openid-connect/auth?client_id=prolongo&state=…' }
        '404':
          description: OIDC выключен (OIDC_ENABLED=0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: not_found, message: Вход через SSO выключен } }

  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      summary: Возврат от OIDC-провайдера (бонус)
      description: Проверяет state, обменивает код на токены, создаёт сессию и перенаправляет на главную.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Код авторизации от провайдера
          schema: { type: string, example: 3f1c0e9a-7b2d-4c8e-9f10-2a6b5d4c3e21 }
        - name: state
          in: query
          required: true
          description: Значение state, которое мы передали на шаге login
          schema: { type: string, example: k3J9xQ }
      responses:
        '302':
          description: 'Сессия создана, редирект на `/`'
          headers:
            Location:
              description: Главная страница панели
              schema: { type: string, example: / }
            Set-Cookie:
              description: Cookie сессии
              schema: { type: string, example: 'prolongo_session=Zm9vYmFy; Path=/; HttpOnly; SameSite=Lax' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Рейтинг клиентов с фильтрами, сортировкой и пагинацией
      description: |
        Сортировка стабильная: при равенстве — по id asc. Клиенты без оценки — всегда в конце при сортировке по `riskScore` и `expectedLoss` в обоих направлениях.
        Пагинация применяется после фильтра; `total` — число клиентов после фильтра.
      parameters:
        - name: sort
          in: query
          description: Поле сортировки
          schema: { type: string, enum: [id, email, balance, totalReplenished, riskScore, expectedLoss], default: expectedLoss, example: expectedLoss }
        - name: order
          in: query
          description: Направление сортировки
          schema: { type: string, enum: [asc, desc], default: desc, example: desc }
        - name: level
          in: query
          description: 'Уровни через запятую: high, medium, low, none (`none` — клиенты без оценки). Без параметра — все.'
          schema: { type: string, example: 'high,medium' }
        - name: search
          in: query
          description: Подстрока email без учёта регистра. Если строка — число, ищется ещё и точный id.
          schema: { type: string, example: user-000 }
        - name: page
          in: query
          description: Номер страницы, с 1
          schema: { type: integer, minimum: 1, default: 1, example: 1 }
        - name: pageSize
          in: query
          description: Клиентов на странице
          schema: { type: integer, minimum: 1, maximum: 200, default: 25, example: 25 }
        - $ref: '#/components/parameters/HorizonDays'
      responses:
        '200':
          description: Страница рейтинга
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerListResponse' }
