  /api/v1/customers/{id}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Карточка клиента — услуги, признаки, причины, деньги
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/HorizonDays'
      responses:
        '200':
          description: Подробная оценка клиента
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
              example:
                id: 5
                email: user-0005@example.test
                balanceCents: 28657
                withdrawBalanceCents: 7623
                bonusBalanceCents: 9863
                bonusState: locked
                totalReplenishedCents: 293608
                scoreStatus: scored
                noScoreReason: null
