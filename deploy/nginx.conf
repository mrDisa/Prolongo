server {
  listen 8080;
  client_max_body_size 20m;
  root /usr/share/nginx/html;

  # Docker DNS: upstreams are resolved per request (proxy_pass with variables), so a recreated
  # core / ingest / prometheus container with a new IP is picked up without restarting nginx.
  # 127.0.0.11 exists only inside the compose network: outside Docker every proxy would answer 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # One place per upstream; locations only say `proxy_pass $core;` and so on.
  set $core http://core:8000;
  set $core_verify http://core:8000/internal/auth/verify;
  set $ingest http://ingest:8001;
  set $prometheus http://prometheus:9090;

  error_page 401 = @unauthorized;
  location @unauthorized {
    default_type application/json;
    return 401 '{"error":{"code":"unauthorized","message":"Требуется вход"}}';
  }

  location = /_auth {
    internal;
    proxy_pass $core_verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  # public: login, login methods and OIDC
  location = /api/v1/auth/login  { proxy_pass $core; }
  location = /api/v1/auth/config { proxy_pass $core; }
  location /api/v1/auth/oidc/   { proxy_pass $core; }

  # ingest
  location /api/v1/source/ {
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    proxy_pass $ingest;
  }
  location /admin/ {
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header Host $host;
    proxy_pass $ingest;
  }
  location /static/ { proxy_pass $ingest; }

  # SSE
  location = /api/v1/stream {
    auth_request /_auth;
    proxy_pass $core;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # core API, Swagger
  location /api/ {
    auth_request /_auth;
    proxy_pass $core;
  }

  # metrics: core checks the bearer token or the session itself
  location = /metrics { proxy_pass $core; }

  # Prometheus UI: only after login
  location /prometheus/ {
    auth_request /_auth;
    proxy_pass $prometheus;
  }

  # SPA
  location / { try_files $uri /index.html; }
}
