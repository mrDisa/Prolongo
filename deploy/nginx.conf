server {
  listen 8080;
  client_max_body_size 20m;
  root /usr/share/nginx/html;

  error_page 401 = @unauthorized;
  location @unauthorized {
    default_type application/json;
    return 401 '{"error":{"code":"unauthorized","message":"Требуется вход"}}';
  }

  location = /_auth {
    internal;
    proxy_pass http://core:8000/internal/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  # public: login, login methods and OIDC
  location = /api/v1/auth/login  { proxy_pass http://core:8000; }
  location = /api/v1/auth/config { proxy_pass http://core:8000; }
  location /api/v1/auth/oidc/   { proxy_pass http://core:8000; }

  # ingest
  location /api/v1/source/ {
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    proxy_pass http://ingest:8001;
  }
  location /admin/ {
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header Host $host;
    proxy_pass http://ingest:8001;
  }
  location /static/ { proxy_pass http://ingest:8001; }

  # SSE
  location = /api/v1/stream {
    auth_request /_auth;
    proxy_pass http://core:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # core API, Swagger
  location /api/ {
    auth_request /_auth;
    proxy_pass http://core:8000;
  }

  # metrics: core checks the bearer token or the session itself
  location = /metrics { proxy_pass http://core:8000; }

  # Prometheus UI: only after login
  location /prometheus/ {
    auth_request /_auth;
    proxy_pass http://prometheus:9090;
  }

  # SPA
  location / { try_files $uri /index.html; }
}
