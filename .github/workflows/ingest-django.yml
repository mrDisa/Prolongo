name: ingest-django

# Django checks for every pull request: all pytest tests of ingest on PostgreSQL 16
# (docs/ТЗ_BACKEND_DJANGO.md §17). The whole repository is checked out, so openapi.yml and
# data/test-data sit next to ingest-django and test_contract runs instead of being skipped.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-django
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prolongo
          POSTGRES_USER: prolongo
          POSTGRES_PASSWORD: prolongo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prolongo -d prolongo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # pytest-django creates and drops its own test_prolongo database on this server
      DATABASE_URL: postgres://prolongo:prolongo@localhost:5432/prolongo
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest-django/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: pytest
        run: python -m pytest -rs -p no:cacheprovider --junitxml=pytest-report.xml

      - name: No tests skipped
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse("pytest-report.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped", 0))
          if skipped:
              print(f"::error::{skipped} test(s) skipped — in CI every test must run, test_contract included")
              sys.exit(1)
          print(f"{suite.get('tests')} tests ran, none skipped")
          EOF
