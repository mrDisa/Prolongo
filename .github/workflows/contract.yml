name: contract

# API contract checks for every pull request (docs/ТЗ_BACKEND_GO.md §15):
# - openapi.yml passes Redocly lint with no errors or warnings;
# - backend-go/openapi/openapi.yml (embedded into core) equals the root file.

on:
  pull_request:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embedded copy matches the root openapi.yml
        run: |
          if ! cmp -s openapi.yml backend-go/openapi/openapi.yml; then
            echo "::error::backend-go/openapi/openapi.yml отличается от корневого openapi.yml — выполните make openapi и закоммитьте"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Redocly lint
        run: npx -y @redocly/cli@1.34.22 lint openapi.yml --max-problems 50
