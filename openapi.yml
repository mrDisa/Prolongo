openapi: 3.1.0
info:
  title: Prolongo API
  version: 0.1.0
  description: |
    Анализатор рисков оттока: рейтинг клиентов, причины риска, денежная оценка, настройки модели и источник данных.

    - Деньги — целые евроценты в полях с суффиксом `Cents` (100 = €1).
    - Даты — ISO 8601 UTC.
    - Все эндпоинты, кроме `auth/login` и `auth/oidc/*`, требуют сессию (cookie `prolongo_session`).
    - Источник правды для контракта — этот файл и `docs/ОБЩЕЕ_ТЗ.md` §7. Изменения — только отдельным PR с предупреждением команды.
servers:
  - url: http://localhost:8080
    description: Локальный запуск через docker compose
security:
  - cookieAuth: []
tags:
  - name: auth
    description: Вход и сессия
  - name: customers
    description: Рейтинг и карточка клиента
  - name: analytics
    description: Сводка, деньги, график оттока
  - name: model
    description: Настройки модели риска
  - name: live
    description: Живые обновления
  - name: source
    description: Источник данных (сервис ingest)
  - name: ops
    description: Метрики и документация

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход. Ставит cookie `prolongo_session` (HttpOnly, SameSite=Lax).
          headers:
            Set-Cookie:
              schema: { type: string, example: prolongo_session=abc...; Path=/; HttpOnly; SameSite=Lax }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_credentials, message: Неверный логин или пароль } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      responses:
        '200':
          description: Сессия активна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Завершение сессии
      responses:
        '204': { description: Сессия удалена, cookie очищена }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      summary: Вход через OIDC (бонус)
      security: []
      responses:
        '302': { description: Редирект на провайдера (Keycloak) }
        '404': { description: OIDC выключен }

  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Возврат от OIDC-провайдера (бонус)
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Сессия создана, редирект на `/` }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/customers:
    get:
      tags: [customers]
      summary: Рейтинг клиентов с фильтрами, сортировкой и пагинацией
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [id, email, balance, totalReplenished, riskScore, expectedLoss], default: expectedLoss }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: level
          in: query
          description: Уровни через запятую. `none` — клиенты без оценки.
          schema: { type: string, example: 'high,medium' }
        - name: search
          in: query
          description: Подстрока email (без учёта регистра) или точный id
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - $ref: '#/components/parameters/HorizonDays'
      responses:
        '200':
          description: Страница рейтинга. При равенстве — по id asc; без оценки — всегда в конце при сортировке по riskScore / expectedLoss.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/customers/{id}:
    get:
      tags: [customers]
      summary: Карточка клиента — услуги, признаки, причины, деньги
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/HorizonDays'
      responses:
        '200':
          description: Подробная оценка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/analytics/summary:
    get:
      tags: [analytics]
      summary: Сводка по уровням риска и денежной оценке
      parameters:
        - $ref: '#/components/parameters/HorizonDays'
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/analytics/churn-timeline:
    get:
      tags: [analytics]
      summary: График оттока — факт и прогноз по дням
      parameters:
        - { name: pastDays, in: query, schema: { type: integer, minimum: 0, maximum: 365, default: 90 } }
        - { name: futureDays, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
        - $ref: '#/components/parameters/HorizonDays'
      responses:
        '200':
          description: Точки графика
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/model/settings:
    get:
      tags: [model]
      summary: Действующие настройки и коэффициенты модели
      responses:
        '200':
          description: Настройки. Список `features` строится из реестра признаков в коде.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [model]
      summary: Изменение настроек с автоматическим пересчётом
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSettingsPatch' }
      responses:
        '200':
          description: Сохранено, пересчёт выполнен, разослано SSE `recalculated`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/model/settings/reset:
    post:
      tags: [model]
      summary: Вернуть стандартные веса, пороги, горизонт и часы
      responses:
        '200':
          description: Настройки после сброса
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/model/preview:
    post:
      tags: [model]
      summary: Посчитать черновик настроек без сохранения
      description: Тело — как у PATCH. Ничего не сохраняет и не рассылает SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSettingsPatch' }
            example: { thresholds: { high: 40 } }
      responses:
        '200':
          description: Результат по черновику и по сохранённым настройкам
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/stream:
    get:
      tags: [live]
      summary: Server-Sent Events
      description: |
        События:
        - `recalculated` — `{"calcVersion": 18, "calculatedAt": "...", "reason": "data|settings|timer|startup"}`
        - `ping` — `{}` каждые 15 секунд
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: recalculated
                data: {"calcVersion": 18, "calculatedAt": "2026-10-19T15:00:05.100Z", "reason": "settings"}
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/source/snapshot:
    put:
      tags: [source]
      summary: Загрузка или полная замена снимка данных (сервис ingest)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Snapshot' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: JSON в формате data.json }
      responses:
        '200':
          description: Снимок применён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/source/events:
    get:
      tags: [source]
      summary: Лента смен статусов услуг
      parameters:
        - { name: accountId, in: query, schema: { type: integer } }
        - { name: serviceId, in: query, schema: { type: integer } }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/EventSource' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: События, новые сверху
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [source]
      summary: Точечные изменения данных («поток в реальном времени»)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventsRequest' }
      responses:
        '200':
          description: Все события применены в одной транзакции
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/source/simulator:
    get:
      tags: [source]
      summary: Состояние симулятора
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [source]
      summary: Запуск, остановка или один шаг симулятора
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatorAction' }
      responses:
        '200':
          description: Состояние после действия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /metrics:
    get:
      tags: [ops]
      summary: Агрегированные метрики в формате Prometheus
      security:
        - metricsBearer: []
        - cookieAuth: []
      responses:
        '200':
          description: Text exposition format
          content:
            text/plain:
              schema: { type: string }
              example: |
                # TYPE prolongo_customers gauge
                prolongo_customers{level="high"} 2
                prolongo_customers{level="medium"} 2
                prolongo_customers{level="low"} 2
                prolongo_customers{level="none"} 4
                # TYPE prolongo_expected_loss_eur gauge
                prolongo_expected_loss_eur 7032.67
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/docs:
    get:
      tags: [ops]
      summary: Swagger UI
      responses:
        '200':
          description: HTML-страница документации
          content:
            text/html:
              schema: { type: string }

  /api/v1/openapi.yml:
    get:
      tags: [ops]
      summary: Этот файл спецификации
      responses:
        '200':
          description: OpenAPI 3.1
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: prolongo_session
    metricsBearer:
      type: http
      scheme: bearer
      description: Значение `METRICS_TOKEN` из .env — для Prometheus

  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 5 }
    HorizonDays:
      name: horizonDays
      in: query
      required: false
      description: Горизонт прогноза на лету (1–365). Без параметра — из настроек модели. Настройки не меняет.
      schema: { type: integer, minimum: 1, maximum: 365, example: 30 }

  responses:
    Unauthorized:
      description: Нет сессии или она истекла
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthorized, message: Требуется вход } }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: Клиент не найден } }
    BadRequest:
      description: Неверные параметры запроса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: bad_request, message: 'sort: допустимые значения id, email, balance, totalReplenished, riskScore, expectedLoss' } }
    ValidationError:
      description: Ошибка валидации; details — пути к полям
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: validation_error, message: Данные не прошли проверку, details: { 'services[3].status': ['Недопустимое значение: paused'] } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, unauthorized, invalid_credentials, not_found, validation_error, internal] }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: array, items: { type: string } }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password, example: admin123 }

    User:
      type: object
      required: [id, username, displayName, authMethod]
      properties:
        id: { type: integer, example: 1 }
        username: { type: string, example: admin }
        displayName: { type: string, example: Администратор }
        authMethod: { type: string, enum: [password, oidc] }

    LoginResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }

    MeResponse:
      type: object
      required: [user, oidcEnabled]
      properties:
        user: { $ref: '#/components/schemas/User' }
        oidcEnabled: { type: boolean, example: false }

    RiskLevel:
      type: string
      enum: [high, medium, low]
    ScoreStatus:
      type: string
      enum: [scored, no_score]
    NoScoreReason:
      type: string
      enum: [no_services, churned, blocked]
    FeatureKey:
      type: string
      description: Ключ признака. Список расширяемый — новые признаки появляются без изменения контракта.
      examples: [prolong_wait, expiring_no_autoprolong, insufficient_funds, failed_payments, churn_history, suspended, short_billing, new_client, loyal_payer]
    ServiceStatus:
      type: string
      enum: [active, blocked, deleted, suspended, prolong_wait]
    PaymentTerm:
      type: string
      enum: [hour, week, month, quarter_year, half_year, year]
    EventSource:
      type: string
      enum: [seed, snapshot, event, admin, simulator, sql, demo_backfill]

    Reason:
      type: object
      required: [feature, points, text]
      properties:
        feature: { $ref: '#/components/schemas/FeatureKey' }
        points: { type: number, example: 45 }
        text: { type: string, example: 'service-0025: срок ожидания оплаты истёк' }

    CustomerListItem:
      type: object
      required: [id, email, balanceCents, totalReplenishedCents, scoreStatus, riskScore, riskLevel, loyalty, probability, expectedLossCents, mrrCents, liveServices, topReasons]
      properties:
        id: { type: integer, example: 5 }
        email: { type: string, example: user-0005@example.test }
        balanceCents: { type: integer, example: 28657 }
        totalReplenishedCents: { type: integer, example: 293608 }
        scoreStatus: { $ref: '#/components/schemas/ScoreStatus' }
        noScoreReason:
          oneOf: [{ $ref: '#/components/schemas/NoScoreReason' }, { type: 'null' }]
        riskScore: { type: [integer, 'null'], minimum: 0, maximum: 100, example: 77 }
        riskLevel:
          oneOf: [{ $ref: '#/components/schemas/RiskLevel' }, { type: 'null' }]
        loyalty: { type: [integer, 'null'], example: 23 }
        probability: { type: [number, 'null'], example: 0.767 }
        expectedLossCents: { type: integer, example: 338372 }
        mrrCents: { type: integer, example: 469140 }
        liveServices: { type: integer, example: 3 }
        topReasons:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Reason' }

    CustomerListResponse:
      type: object
      required: [items, total, page, pageSize, calcVersion, calculatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomerListItem' } }
        total: { type: integer, example: 10 }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 25 }
        calcVersion: { type: integer, example: 17 }
        calculatedAt: { type: string, format: date-time }

    Money:
      type: object
      required: [horizonDays, revenueCents, bonusCoveredCents, balanceCoveredCents, atRiskCents, expectedLossCents, mrrCents, explanation]
      properties:
        horizonDays: { type: integer, example: 30 }
        revenueCents: { type: integer, example: 469765, description: Сколько живые услуги принесли бы за горизонт }
        bonusCoveredCents: { type: integer, example: 0 }
        balanceCoveredCents: { type: integer, example: 28657 }
        atRiskCents: { type: integer, example: 441108 }
        expectedLossCents: { type: integer, example: 338372 }
        mrrCents: { type: integer, example: 469140 }
        explanation: { type: string, example: 'Услуги принесут €4 697,65 за 30 дней. Бонусы заблокированы, €286,57 спишется с баланса автоматически. Под риском €4 411,08, вероятность ухода 77% → ожидаемые потери €3 383,72.' }

    Contribution:
      type: object
      required: [feature, title, scope, value, weight, points, text]
      properties:
        feature: { $ref: '#/components/schemas/FeatureKey' }
        title: { type: string, example: Ждёт оплаты }
        scope: { type: string, enum: [service, account] }
        serviceId: { type: [integer, 'null'], example: 25 }
        value: { type: number, minimum: 0, maximum: 1, example: 1 }
        weight: { type: number, example: 45 }
        points: { type: number, example: 45 }
        text: { type: string }

    Recommendation:
      type: object
      required: [feature, action]
      properties:
        feature: { $ref: '#/components/schemas/FeatureKey' }
        action: { type: string, example: 'Срочно: письмо или звонок со ссылкой на оплату, предложить отсрочку' }

    ServiceItem:
      type: object
      required: [id, name, status, paymentTerm, autoProlong, priceCents, createdAt, expiresAt, daysLeft, mrrCents]
      properties:
        id: { type: integer, example: 25 }
        name: { type: string, example: service-0025 }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        paymentTerm: { $ref: '#/components/schemas/PaymentTerm' }
        autoProlong: { type: boolean }
        priceCents: { type: integer, example: 651 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        daysLeft: { type: number, example: -399.9 }
        riskScore: { type: [integer, 'null'], example: 77 }
        mrrCents: { type: integer, example: 468720 }

    TransactionItem:
      type: object
      required: [id, serviceId, type, status, amountCents, createdAt]
      properties:
        id: { type: integer, example: 95 }
        serviceId: { type: integer, example: 5 }
        type: { type: string, enum: [order, prolong] }
        status: { type: string, enum: [performed, not_performed] }
        amountCents: { type: integer, example: 292 }
        createdAt: { type: string, format: date-time }
        performedAt: { type: [string, 'null'], format: date-time }

    StatusEvent:
      type: object
      required: [id, serviceId, accountId, toStatus, occurredAt, source]
      properties:
        id: { type: integer }
        serviceId: { type: integer, example: 1 }
        accountId: { type: integer, example: 1 }
        fromStatus:
          oneOf: [{ $ref: '#/components/schemas/ServiceStatus' }, { type: 'null' }]
        toStatus: { $ref: '#/components/schemas/ServiceStatus' }
        occurredAt: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/EventSource' }

    StatusEventList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StatusEvent' } }
        total: { type: integer }

    CustomerDetail:
      type: object
      required: [id, email, balanceCents, withdrawBalanceCents, bonusBalanceCents, bonusState, totalReplenishedCents, scoreStatus, money, contributions, recommendations, services, transactions, statusHistory, calcVersion, calculatedAt]
      properties:
        id: { type: integer, example: 5 }
        email: { type: string, example: user-0005@example.test }
        balanceCents: { type: integer, example: 28657 }
        withdrawBalanceCents: { type: integer, example: 7623 }
        bonusBalanceCents: { type: integer, example: 9863 }
        bonusState: { type: string, enum: [locked, unlocked] }
        totalReplenishedCents: { type: integer, example: 293608 }
        scoreStatus: { $ref: '#/components/schemas/ScoreStatus' }
        noScoreReason:
          oneOf: [{ $ref: '#/components/schemas/NoScoreReason' }, { type: 'null' }]
        riskScore: { type: [integer, 'null'], example: 77 }
        riskLevel:
          oneOf: [{ $ref: '#/components/schemas/RiskLevel' }, { type: 'null' }]
        loyalty: { type: [integer, 'null'], example: 23 }
        probability: { type: [number, 'null'], example: 0.767 }
        money: { $ref: '#/components/schemas/Money' }
        riskiestServiceId: { type: [integer, 'null'], example: 25 }
        contributions:
          type: array
          description: Все признаки самой рисковой услуги с ненулевыми баллами, по убыванию |points|
          items: { $ref: '#/components/schemas/Contribution' }
        recommendations: { type: array, items: { $ref: '#/components/schemas/Recommendation' } }
        services: { type: array, items: { $ref: '#/components/schemas/ServiceItem' } }
        transactions: { type: array, items: { $ref: '#/components/schemas/TransactionItem' } }
        statusHistory: { type: array, items: { $ref: '#/components/schemas/StatusEvent' } }
        calcVersion: { type: integer, example: 17 }
        calculatedAt: { type: string, format: date-time }

    Summary:
      type: object
      required: [calcVersion, calculatedAt, referenceTime, clockMode, horizonDays, customers, services, money, topAtRisk]
      properties:
        calcVersion: { type: integer, example: 17 }
        calculatedAt: { type: string, format: date-time }
        referenceTime: { type: string, format: date-time, example: '2026-10-19T14:35:53.000Z' }
        clockMode: { type: string, enum: [data, real, fixed] }
        horizonDays: { type: integer, example: 30 }
        customers:
          type: object
          required: [total, high, medium, low, noScore]
          properties:
            total: { type: integer, example: 10 }
            high: { type: integer, example: 2 }
            medium: { type: integer, example: 2 }
            low: { type: integer, example: 2 }
            noScore: { type: integer, example: 4 }
        services:
          type: object
          required: [total, live, atRisk, prolongWait]
          properties:
            total: { type: integer, example: 30 }
            live: { type: integer, example: 18 }
            atRisk: { type: integer, example: 9 }
            prolongWait: { type: integer, example: 6 }
        money:
          type: object
          required: [expectedLossCents, worstCaseLossCents, mrrAtRiskCents, totalMrrCents, savableTop20Cents]
          properties:
            expectedLossCents: { type: integer, example: 703267 }
            worstCaseLossCents: { type: integer, example: 966052 }
            mrrAtRiskCents: { type: integer, example: 1155577 }
            totalMrrCents: { type: integer, example: 1159275 }
            savableTop20Cents: { type: integer, example: 703267 }
        topAtRisk:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/CustomerListItem' }

    TimelinePoint:
      type: object
      required: [date, kind]
      properties:
        date: { type: string, format: date, example: '2026-10-20' }
        kind: { type: string, enum: [fact, forecast] }
        deletions: { type: integer, description: 'fact: переходы в deleted из status_events' }
        deletionsEstimated: { type: integer, description: 'fact: оценка по deleted-услугам данных (expiresAt + 5 дн.)' }
        servicesAtRisk: { type: [integer, 'null'], description: 'fact: из core.risk_daily' }
        expectedNonRenewals: { type: number, description: 'forecast: Σ вероятностей непродления услуг со сроком в этот день', example: 3.5 }

    TimelineResponse:
      type: object
      required: [referenceTime, points]
      properties:
        referenceTime: { type: string, format: date-time }
        points: { type: array, items: { $ref: '#/components/schemas/TimelinePoint' } }

    FeatureSetting:
      type: object
      required: [key, title, description, scope, weight, defaultWeight, min, max, enabled]
      properties:
        key: { $ref: '#/components/schemas/FeatureKey' }
        title: { type: string, example: Ждёт оплаты }
        description: { type: string, example: 'Услуга в статусе prolong_wait: срок истёк, через 5 дней будет удалена.' }
        scope: { type: string, enum: [service, account] }
        weight: { type: number, example: 45 }
        defaultWeight: { type: number, example: 45 }
        min: { type: number, example: 0 }
        max: { type: number, example: 100 }
        enabled: { type: boolean, example: true }

    Thresholds:
      type: object
      required: [medium, high]
      properties:
        medium: { type: integer, minimum: 1, maximum: 99, example: 30 }
        high: { type: integer, minimum: 2, maximum: 100, example: 60 }

    Clock:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [data, real, fixed], description: 'data — время источника (source_clock), real — системное, fixed — fixedAt' }
        fixedAt: { type: [string, 'null'], format: date-time }

    ModelSettings:
      type: object
      required: [version, updatedAt, horizonDays, thresholds, clock, features]
      properties:
        version: { type: integer, example: 5 }
        updatedAt: { type: string, format: date-time }
        horizonDays: { type: integer, minimum: 1, maximum: 365, example: 30 }
        thresholds: { $ref: '#/components/schemas/Thresholds' }
        clock: { $ref: '#/components/schemas/Clock' }
        features: { type: array, items: { $ref: '#/components/schemas/FeatureSetting' } }

    ModelSettingsPatch:
      type: object
      description: Только изменённые поля
      properties:
        horizonDays: { type: integer, minimum: 1, maximum: 365 }
        thresholds:
          type: object
          properties:
            medium: { type: integer, minimum: 1, maximum: 99 }
            high: { type: integer, minimum: 2, maximum: 100 }
        clock: { $ref: '#/components/schemas/Clock' }
        features:
          type: object
          description: Ключ — FeatureKey
          additionalProperties:
            type: object
            properties:
              weight: { type: number }
              enabled: { type: boolean }
      example: { horizonDays: 14, thresholds: { high: 65 }, features: { prolong_wait: { weight: 50 } } }

    PreviewSummary:
      type: object
      required: [customers, money]
      properties:
        customers:
          type: object
          properties:
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            noScore: { type: integer }
        money:
          type: object
          properties:
            expectedLossCents: { type: integer }
            worstCaseLossCents: { type: integer }

    PreviewResponse:
      type: object
      required: [summary, baseline, customers, features]
      properties:
        summary: { $ref: '#/components/schemas/PreviewSummary' }
        baseline: { $ref: '#/components/schemas/PreviewSummary' }
        customers:
          type: array
          items:
            type: object
            required: [id, email, riskScore, riskScoreRaw, riskLevel, expectedLossCents, riskiestServiceName, contributions]
            properties:
              id: { type: integer, example: 5 }
              email: { type: string }
              riskScore: { type: integer, example: 77 }
              riskScoreRaw: { type: number, example: 76.7 }
              riskLevel: { $ref: '#/components/schemas/RiskLevel' }
              expectedLossCents: { type: integer, example: 338372 }
              riskiestServiceName: { type: string, example: service-0025 }
              contributions:
                type: array
                items:
                  type: object
                  required: [feature, points]
                  properties:
                    feature: { $ref: '#/components/schemas/FeatureKey' }
                    points: { type: number }
        features:
          type: array
          items:
            type: object
            required: [key, customersHit, maxPoints]
            properties:
              key: { $ref: '#/components/schemas/FeatureKey' }
              customersHit: { type: integer, example: 2 }
              maxPoints: { type: number, example: 45 }

    SourceAccount:
      type: object
      description: Формат data.json организаторов
      required: [id, email, balance, withdrawBalance, totalReplenished, bonusBalance, bonusState]
      properties:
        id: { type: integer, minimum: 1, example: 5 }
        email: { type: string, example: user-0005@example.test }
        balance: { type: integer, minimum: 0, example: 28657 }
        withdrawBalance: { type: integer, minimum: 0, example: 7623 }
        totalReplenished: { type: integer, minimum: 0, example: 293608 }
        bonusBalance: { type: integer, minimum: 0, example: 9863 }
        bonusState: { type: string, enum: [locked, unlocked] }

    SourceService:
      type: object
      required: [id, name, ownerId, paymentTerm, autoProlong, createdAt, expiresAt, status, price]
      properties:
        id: { type: integer, minimum: 1, example: 25 }
        name: { type: string, pattern: '^[A-Za-z0-9-]+$', example: service-0025 }
        ownerId: { type: integer, example: 5 }
        paymentTerm: { $ref: '#/components/schemas/PaymentTerm' }
        autoProlong: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        price: { type: integer, minimum: 0, example: 651 }

    SourceTransaction:
      type: object
      required: [id, amount, status, createdAt, type, serviceId]
      properties:
        id: { type: integer, minimum: 1, example: 95 }
        amount: { type: integer, minimum: 0, maximum: 1000, example: 292 }
        status: { type: string, enum: [performed, not_performed] }
        performedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        type: { type: string, enum: [prolong, order] }
        serviceId: { type: integer, example: 5 }

    Snapshot:
      type: object
      required: [accounts, services, transactions]
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/SourceAccount' } }
        services: { type: array, items: { $ref: '#/components/schemas/SourceService' } }
        transactions: { type: array, items: { $ref: '#/components/schemas/SourceTransaction' } }

    SnapshotResponse:
      type: object
      required: [batchId, accounts, services, transactions, statusChanges, removed]
      properties:
        batchId: { type: integer, example: 12 }
        accounts: { type: integer, example: 10 }
        services: { type: integer, example: 30 }
        transactions: { type: integer, example: 100 }
        statusChanges: { type: integer, example: 0 }
        removed:
          type: object
          properties:
            accounts: { type: integer, example: 0 }
            services: { type: integer, example: 0 }
            transactions: { type: integer, example: 0 }

    SourceEvent:
      type: object
      required: [entity, op, data]
      properties:
        entity: { type: string, enum: [account, service, transaction] }
        op: { type: string, enum: [upsert, delete] }
        data:
          type: object
          description: Поля в формате data.json; для upsert существующей записи — только изменённые поля + id
          additionalProperties: true
          example: { id: 5, balance: 15000 }

    EventsRequest:
      type: object
      required: [events]
      properties:
        at: { type: string, format: date-time, description: Время события источника; двигает source_clock вперёд }
        events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SourceEvent' } }

    EventsResponse:
      type: object
      required: [applied, statusChanges]
      properties:
        applied: { type: integer, example: 3 }
        statusChanges: { type: integer, example: 1 }

    SimulatorState:
      type: object
      required: [running, intervalSeconds, tickHours, eventsGenerated, dataTime]
      properties:
        running: { type: boolean, example: false }
        intervalSeconds: { type: integer, example: 3 }
        tickHours: { type: number, example: 6 }
        eventsGenerated: { type: integer, example: 0 }
        dataTime: { type: string, format: date-time, example: '2026-10-19T14:35:53.000Z' }

    SimulatorAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, stop, tick] }
        intervalSeconds: { type: integer, minimum: 1, maximum: 60 }
        tickHours: { type: number, minimum: 0.25, maximum: 168 }
